services:
  # Node.js / Express REST API Backend Service
  - type: web
    name: urbannest-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: N8N_QUERY_WEBHOOK_URL
        sync: false
      - key: N8N_CHATBOT_WEBHOOK_URL
        sync: false

  # React + Vite Static Frontend Web Service
  - type: web
    name: urbannest-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
